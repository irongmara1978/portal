<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Search | Irongmara ME School</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#1e293b;
  --accent:#2563eb;
  --bg:#f1f5f9;
  --card:#ffffff;
  --border:#e2e8f0;
  --text:#334155;
  --success:#10b981;
}

*{ box-sizing:border-box; font-family:'Inter',sans-serif; }

body{ margin:0; background:var(--bg); padding:40px 20px; color:var(--text); }

.container{ max-width:900px; margin:auto; background:white; border-radius:18px; overflow:hidden; box-shadow:0 10px 25px rgba(0,0,0,0.08); }

.header{ background:var(--primary); color:white; padding:30px 35px; }
.header h1{ margin:0; font-size:24px; }
.header p{ margin:8px 0 0; opacity:0.8; font-size:14px; }

.search-box{ padding:25px 35px; display:flex; gap:15px; border-bottom:1px solid var(--border); background:#fff; }
.search-box input{ flex:1; padding:14px; border:1px solid var(--border); border-radius:10px; font-size:15px; }
.search-box button{ padding:14px 28px; background:var(--accent); border:none; border-radius:10px; color:white; font-weight:600; cursor:pointer; transition: 0.2s; }
.search-box button:hover{ background:#1d4ed8; }

/* Selection List Styles */
.results{ padding:20px 35px; }
.list-item{ 
  display:flex; justify-content:space-between; align-items:center;
  padding:15px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px;
  background:#fff; transition: 0.2s;
}
.list-item:hover{ border-color:var(--accent); background:#f8fafc; }
.student-brief h4{ margin:0; font-size:16px; color:var(--primary); }
.student-brief p{ margin:4px 0 0; font-size:13px; color:#64748b; }

.view-btn{ 
  padding:8px 16px; background:white; border:1.5px solid var(--accent); 
  color:var(--accent); border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
}
.view-btn:hover{ background:var(--accent); color:white; }

/* Full Detail Modal */
.modal-overlay {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;
}
.modal-content {
  background:white; width:95%; max-width:800px; max-height:90vh; 
  border-radius:15px; overflow-y:auto; position:relative; animation: slideUp 0.3s ease-out;
}
@keyframes slideUp { from { transform: translateY(20px); opacity:0; } to { transform: translateY(0); opacity:1; } }

.modal-header { padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:white; }
.close-modal { font-size:24px; cursor:pointer; border:none; background:none; color:#64748b; }

.detail-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; padding:25px; }
.detail-item { border:1px solid #f1f5f9; padding:12px; border-radius:8px; background:#f8fafc; }
.detail-label { font-size:10px; text-transform:uppercase; font-weight:700; color:#94a3b8; margin-bottom:4px; }
.detail-value { font-size:14px; font-weight:600; color:var(--primary); }

.print-btn { margin: 25px; padding: 12px 20px; background: #334155; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

@media(max-width:600px){ .search-box{ flex-direction:column; } .list-item{ flex-direction:column; align-items:flex-start; gap:12px; } }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Digital Student Register</h1>
    <p>Irongmara M.E. School | Search & Verification Portal</p>
  </div>

  <div class="search-box">
    <input type="text" id="searchText" placeholder="Enter student name (e.g. Rahul Das)">
    <button onclick="searchStudents()">Search Register</button>
  </div>

  <div id="results" class="results">
    <div class="message" style="text-align:center; padding:40px; color:#94a3b8;">
      Enter a name above to retrieve records.
    </div>
  </div>
</div>

<!-- Detailed View Modal -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="m-name" style="margin:0; color:var(--accent);">Student Details</h2>
      <button class="close-modal" onclick="closeModal()">&times;</button>
    </div>
    
    <div class="detail-grid" id="detailGrid">
      <!-- Data will be injected here -->
    </div>
    
    <button class="print-btn" onclick="window.print()">Print This Record</button>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUSdhh7d_ZJAC2cFocGhAr0SMCb4bre_mHDWV-U0McaHY7EL54Hp-w7o3HQv2V5Gsv/exec";
let currentResults = [];

function searchStudents(){
  const searchText = document.getElementById("searchText").value.trim();
  const resultsDiv = document.getElementById("results");

  if(!searchText) { alert("Please enter a name"); return; }

  resultsDiv.innerHTML = `<div style="text-align:center; padding:40px;">Searching database...</div>`;

  fetch(`${SCRIPT_URL}?studentName=${encodeURIComponent(searchText)}`)
    .then(res => res.json())
    .then(data => {
      currentResults = data;
      if(data.length === 0){
        resultsDiv.innerHTML = `<div style="text-align:center; padding:40px;">No records found.</div>`;
        return;
      }

      resultsDiv.innerHTML = `<p style="font-size:13px; margin-bottom:15px; color:#64748b;">Found ${data.length} match(es):</p>`;
      
      data.forEach((student, index) => {
        resultsDiv.innerHTML += `
          <div class="list-item">
            <div class="student-brief">
              <h4>${student.studentName}</h4>
              <p>Father: ${student.father} | Class: ${student.className} | Session: ${student.session}</p>
            </div>
            <button class="view-btn" onclick="showDetails(${index})">View Full Profile</button>
          </div>
        `;
      });
    })
    .catch(err => {
      resultsDiv.innerHTML = `<div style="text-align:center; padding:40px; color:red;">Error connecting to server.</div>`;
    });
}

function showDetails(index) {
  const s = currentResults[index];
  const grid = document.getElementById("detailGrid");
  document.getElementById("m-name").innerText = s.studentName;
  
  const fields = [
    { label: "Admission No", val: s.admissionNo },
    { label: "Academic Session", val: s.session },
    { label: "Class", val: s.className },
    { label: "Gender", val: s.sex },
    { label: "Date of Birth", val: s.dob },
    { label: "Date of Admission", val: s.admissionDate },
    { label: "Student Aadhaar", val: s.studentAadhaar }, // Field added here
    { label: "APAAR ID", val: s.apaar },
    { label: "Father's Name", val: s.father },
    { label: "Mother's Name", val: s.mother },
    { label: "Phone", val: s.phone },
    { label: "Category", val: s.socialCategory },
    { label: "PEN", val: s.pen },
    { label: "Unique ID", val: s.uniqueID },
    { label: "Address", val: s.address }
    { label: "Remarks", val: s.remarks }
  ];

grid.innerHTML = fields.map(f => {
    // Check if this specific item is the Remarks field
    const isRemarks = f.label === "Remarks";
    
    return `
      <div class="detail-item" style="${isRemarks ? 'grid-column: span 12; background: #fff7ed; border: 1px solid #fed7aa;' : ''}">
        <div class="detail-label" style="${isRemarks ? 'color: #c2410c;' : ''}">${f.label}</div>
        <div class="detail-value" style="${isRemarks ? 'color: #9a3412; font-weight: 700;' : ''}">
          ${f.val || "N/A"}
        </div>
      </div>
    `;
  }).join('');

  document.getElementById("modalOverlay").style.display = "flex";
}
function closeModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

// Close modal if user clicks outside of it
window.onclick = function(event) {
  let modal = document.getElementById("modalOverlay");
  if (event.target == modal) closeModal();
}
</script>

</body>
</html>
