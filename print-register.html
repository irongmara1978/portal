<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Printable Register | Irongmara ME School</title>
    <style>
        /* Legal Landscape with 0.8 inch left binding margin */
        @page { size: legal landscape; margin: 0.2in 0.3in 0.2in 0.8in; }
        body { font-family: 'Inter', sans-serif; font-size: 11pt; color: #000; margin: 0; }
        
        .print-header { text-align: center; margin-bottom: 10px; }
        .print-header h1 { margin: 0; font-size: 18pt; text-transform: uppercase; }
        
        /* Apply table styling to a class since we will generate multiple tables */
        .registerTable { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; 
        }
        
        th, td { 
            border: 1.5px solid #000; 
            padding: 14px 10px; /* Safe padding that prevents overflow */
            vertical-align: middle; 
            word-wrap: break-word; 
        }
        
        th { background: #f1f5f9; text-transform: uppercase; font-size: 9pt; height: 30px; }
        
        .std-name { 
            font-weight: bold; 
            font-size: 14pt; 
            display: block; 
            margin-bottom: 6px; 
            text-transform: uppercase;
        }
        
        .label { font-weight: bold; font-size: 9pt; color: #333; text-transform: uppercase; }
        .data-row { margin-bottom: 5px; line-height: 1.4; font-size: 11.5pt; }

        /* The definitive class to force a clean page break */
        .page-break { 
            page-break-after: always; 
            break-after: page; 
            margin-top: 20px; /* Gives breathing room before the next page starts */
        }

        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>

<div class="no-print" style="padding: 20px; background: #2563eb; color: white; text-align: center;">
    <button onclick="window.print()" style="padding: 12px 24px; cursor: pointer; font-weight: bold; font-size: 16px;">PRINT REGISTER NOW</button>
    <p>Required Settings: Paper: <b>Legal</b> | Layout: <b>Landscape</b> | Margins: <b>Default</b></p>
</div>

<div class="print-header">
    <h1>Master Admission Register - Session 2026-27</h1>
    <p>Irongmara M.E. School, Silchar, Assam</p>
</div>

<div id="mainContainer"></div>

<script>
function formatDate(dateStr) {
    if (!dateStr || dateStr === "Nil") return "N/A";
    const date = new Date(dateStr);
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    return `${day}/${month}/${year}`;
}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUSdhh7d_ZJAC2cFocGhAr0SMCb4bre_mHDWV-U0McaHY7EL54Hp-w7o3HQv2V5Gsv/exec";

fetch(`${SCRIPT_URL}?session=2026-27`)
    .then(res => res.json())
    .then(data => {
        // --- SORTING LOGIC ---
        data.sort((a, b) => {
            return (parseInt(a[1]) || 0) - (parseInt(b[1]) || 0);
        });

        const container = document.getElementById("mainContainer");
        
        // Define exactly how many students fit per page safely
        const STUDENTS_PAGE_1 = 4;
        const STUDENTS_PER_PAGE = 5; 
        
        let htmlOutput = "";
        let currentTableRows = "";
        let rowsInCurrentTable = 0;
        let isFirstPage = true;

        // The repeating column header for every new page
        const tableHeaderTemplate = `
            <table class="registerTable">
               <thead>
                <tr>
                    <th style="width: 70px;">Adm. No & Date of Admission</th> 
                    <th>Student's Details</th>
                    <th>Parental & Contact</th>
                    <th>Student's Identity Numbers</th>
                    <th>Address & Remarks</th>
                </tr>
            </thead>
            <tbody>
        `;

        data.forEach((s, i) => {
            
            // Build the row for the current student
            let rowHtml = `
                <tr>
                    <td align="center">
                        <div style="font-size: 18pt; font-weight: bold; color: #000;">${s[1] || 'N/A'}</div>
                        <div style="font-size: 12pt; margin-top: 6px; color: #444;">${formatDate(s[7])}</div>
                    </td>
                    <td>
                        <span class="std-name">${s[3]}</span>
                        <div class="data-row"><span class="label">DOB:</span> ${formatDate(s[6])} | <span class="label">Cat:</span> ${s[5]}</div>
                        <div class="data-row"><span class="label">Class:</span> ${s[8]} | <span class="label">Sex:</span> ${s[4]}</div>
                    </td>
                    <td>
                        <div class="data-row"><span class="label">Father:</span> ${s[13]}</div>
                        <div class="data-row"><span class="label">Mother:</span> ${s[14]}</div>
                        <div class="data-row"><span class="label">Phone:</span> ${s[16]}</div>
                        <div class="data-row"><span class="label">Guardian's Aadhaar:</span> ${s[15]}</div>
                    </td>
                    <td>
                        <div class="data-row"><span class="label">PEN:</span> ${s[9]}</div>
                        <div class="data-row"><span class="label">APAAR:</span> ${s[11]}</div>
                        <div class="data-row"><span class="label">AADHAAR:</span> ${s[12]}</div>
                        <div class="data-row"><span class="label">Unique ID:</span> ${s[10]}</div>
                    </td>
                    <td>
                        <div class="data-row"><span class="label">Address:</span> ${s[17]}</div>
                        <div class="data-row"><span class="label">Prev UDISE:</span> ${s[18]}</div>
                        <div class="data-row" style="font-style: italic;"><span class="label">Remarks:</span> ${s[19] || 'Nil'}</div>
                    </td>
                </tr>
            `;

            currentTableRows += rowHtml;
            rowsInCurrentTable++;

            // Determine max rows for the current page
            let maxRowsAllowed = isFirstPage ? STUDENTS_PAGE_1 : STUDENTS_PER_PAGE;

            // If we hit the limit for this page, OR if this is the very last student in the database
            if (rowsInCurrentTable === maxRowsAllowed || i === data.length - 1) {
                
                // Wrap the rows in a complete table and add it to the output
                htmlOutput += tableHeaderTemplate + currentTableRows + `</tbody></table>`;
                
                // If it's not the last student, insert a clean page break
                if (i !== data.length - 1) {
                    htmlOutput += `<div class="page-break"></div>`;
                }
                
                // Reset variables to start building the next page
                currentTableRows = "";
                rowsInCurrentTable = 0;
                isFirstPage = false;
            }
        });

        // Finally, inject all the generated tables into the page
        container.innerHTML = htmlOutput;
    });
</script>
</body>
</html>
